apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flask-app-alerts
  namespace: observability
  labels:
    release: prometheus
    app: kube-prometheus-stack
spec:
  groups:
  - name: application-alerts
    rules:
    - alert: HighLatencyAlert
      # Calculates the 99th percentile latency over 5 minutes. 
      # Triggers if the P99 latency exceeds 2 seconds.
      expr: histogram_quantile(0.99, sum(rate(flask_app_request_latency_seconds_bucket[5m])) by (le, endpoint)) > 2.0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "High Latency Detected on Flask App"
        description: "The 99th percentile request latency is taking longer than 2 seconds."