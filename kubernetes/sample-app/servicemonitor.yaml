apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flask-app-monitor
  namespace: observability 
  labels:
    release: prometheus 
spec:
  namespaceSelector:
    matchNames:
      - application  # <-- TELLS PROMETHEUS WHERE TO LOOK
  selector:
    matchLabels:
      app: flask-app 
  endpoints:
  - port: http-metrics 
    path: /metrics
    interval: 15s